
name: Build Astral Client

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Extrair projeto
        run: |
          unzip -q AstralClient-Fase1-Fonte.zip -d .
          ls -la AstralClient-Fase1

      - name: Compilar Astral
        working-directory: AstralClient-Fase1
        run: |
          gradle setupDecompWorkspace
          gradle build --no-daemon

      - name: Salvar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstralClient-Fase1
          path: AstralClient-Fase1/build/libs/*.jar
          
